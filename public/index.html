<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>加藤先生から逃げろ！オンライン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      overflow: hidden;
      color: #fff;
    }

    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
    }

    #loginScreen.hidden {
      display: none;
    }

    #loginScreen h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      animation: pulse 2s ease-in-out infinite;
    }

    #loginScreen p {
      font-size: 1.1em;
      margin-bottom: 20px;
      color: #ffaa00;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
      50% { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000; }
    }

    #loginScreen input {
      padding: 15px 30px;
      font-size: 1.2em;
      border: 2px solid #ff0000;
      background: rgba(255, 0, 0, 0.1);
      color: #fff;
      border-radius: 10px;
      margin-bottom: 20px;
      outline: none;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    #loginScreen button {
      padding: 15px 50px;
      font-size: 1.2em;
      border: none;
      background: linear-gradient(135deg, #ff0000 0%, #aa0000 100%);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      transition: all 0.3s;
    }

    #loginScreen button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
    }

    #gameCanvas {
      border: 3px solid #ff0000;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
      background: #1a1a1a;
      max-width: 100%;
      max-height: 100%;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 12px 20px;
      border-radius: 12px;
      border: 2px solid #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
      z-index: 100;
    }

    #roleText {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #ff0000;
    }

    #statsText {
      font-size: 0.9em;
      color: #ffaa00;
    }

    #taskProgress {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 12px 20px;
      border-radius: 12px;
      border: 2px solid #00ff00;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
      z-index: 100;
    }

    #taskProgress h3 {
      color: #00ff00;
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    #taskProgress p {
      font-size: 1.2em;
      font-weight: bold;
    }

    #playerList {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #ffaa00;
      max-height: 200px;
      overflow-y: auto;
      min-width: 180px;
      z-index: 100;
    }

    #playerList h3 {
      color: #ffaa00;
      font-size: 0.85em;
      margin-bottom: 8px;
      text-align: center;
    }

    .player-item {
      padding: 5px 8px;
      margin: 3px 0;
      background: rgba(255, 170, 0, 0.1);
      border-radius: 5px;
      font-size: 0.8em;
    }

    .player-item.teacher {
      background: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff0000;
    }

    .player-item.captured {
      opacity: 0.5;
      text-decoration: line-through;
    }

    #joystickArea {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      border: 3px solid rgba(255, 0, 0, 0.4);
      display: none;
      z-index: 50;
    }

    #joystick {
      position: absolute;
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #ff0000 0%, #aa0000 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #interactBtn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #00ff00 0%, #00aa00 100%);
      border-radius: 50%;
      border: 3px solid #00ff00;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 2em;
      z-index: 50;
      cursor: pointer;
    }

    #notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 30px 50px;
      border-radius: 15px;
      border: 3px solid #ff0000;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
      z-index: 200;
      display: none;
      text-align: center;
    }

    #notification h2 {
      font-size: 2em;
      margin-bottom: 15px;
      text-shadow: 0 0 20px #ff0000;
    }

    #notification p {
      font-size: 1.2em;
      color: #ffaa00;
    }

    @media (max-width: 768px) {
      #joystickArea, #interactBtn {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <h1>🏫 加藤先生から逃げろ！</h1>
    <p>オンライン対戦版</p>
    <input type="text" id="nameInput" placeholder="名前を入力" maxlength="12">
    <button id="joinButton">ゲーム参加</button>
  </div>

  <div id="gameContainer" style="display: none;">
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    
    <div id="hud">
      <div id="roleText">生徒</div>
      <div id="statsText">スコア: 0点</div>
    </div>

    <div id="taskProgress">
      <h3>📋 タスク進捗</h3>
      <p id="taskText">0/5</p>
    </div>

    <div id="playerList">
      <h3>👥 プレイヤー</h3>
      <div id="playerListContent"></div>
    </div>

    <div id="joystickArea">
      <div id="joystick"></div>
    </div>

    <div id="interactBtn">📝</div>

    <div id="notification">
      <h2 id="notifTitle">通知</h2>
      <p id="notifText"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const socket = io();

    let myId = null;
    let players = [];
    let tasks = [];
    let obstacles = [];
    let exitOpen = false;
    let keys = {};
    let joystickActive = false;
    let joystickDir = { x: 0, y: 0 };
    let nearbyTask = null;

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = (Math.random() - 0.5) * 3;
        this.life = 1;
        this.color = color;
        this.size = Math.random() * 3 + 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.02;
        this.vy += 0.1;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];

    // ログイン
    document.getElementById('joinButton').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim() || 'Student';
      socket.emit('join', name);
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'flex';
    });

    document.getElementById('nameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('joinButton').click();
      }
    });

    // キーボード操作
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'e' || e.key === 'E') {
        interactWithTask();
      }
      updateMovement();
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      updateMovement();
    });

    function updateMovement() {
      let x = 0, y = 0;
      
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) x -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) x += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) y -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) y += 1;

      if (x !== 0 || y !== 0) {
        const length = Math.sqrt(x * x + y * y);
        x /= length;
        y /= length;
      }

      socket.emit('move', { x, y });
    }

    // ジョイスティック
    const joystickArea = document.getElementById('joystickArea');
    const joystick = document.getElementById('joystick');

    joystickArea.addEventListener('touchstart', handleJoystickStart);
    joystickArea.addEventListener('touchmove', handleJoystickMove);
    joystickArea.addEventListener('touchend', handleJoystickEnd);

    function handleJoystickStart(e) {
      e.preventDefault();
      joystickActive = true;
    }

    function handleJoystickMove(e) {
      e.preventDefault();
      if (!joystickActive) return;

      const rect = joystickArea.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const touch = e.touches[0];
      const x = touch.clientX - rect.left - centerX;
      const y = touch.clientY - rect.top - centerY;

      const distance = Math.sqrt(x * x + y * y);
      const maxDistance = rect.width / 2 - 30;

      if (distance > 0) {
        let dirX = x / distance;
        let dirY = y / distance;
        
        const clampedDistance = Math.min(distance, maxDistance);
        joystick.style.transform = `translate(${dirX * clampedDistance}px, ${dirY * clampedDistance}px)`;

        joystickDir.x = dirX;
        joystickDir.y = dirY;
        socket.emit('move', joystickDir);
      }
    }

    function handleJoystickEnd(e) {
      e.preventDefault();
      joystickActive = false;
      joystick.style.transform = 'translate(-50%, -50%)';
      joystickDir = { x: 0, y: 0 };
      socket.emit('move', joystickDir);
    }

    // インタラクトボタン
    document.getElementById('interactBtn').addEventListener('click', interactWithTask);

    function interactWithTask() {
      const me = players.find(p => p.id === myId);
      if (!me || me.isTeacher || me.isCaptured) return;

      if (nearbyTask !== null) {
        socket.emit('interactTask', nearbyTask);
      }

      // 脱出判定
      if (exitOpen) {
        const exitX = canvas.width / 2;
        const exitY = 50;
        const dx = exitX - me.x;
        const dy = exitY - me.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < 80) {
          socket.emit('escape');
        }
      }
    }

    // Socket.io イベント
    socket.on('init', (data) => {
      myId = data.id;
      players = data.players;
      tasks = data.tasks;
      obstacles = data.obstacles;
      exitOpen = data.exitOpen;
    });

    socket.on('playerJoined', (player) => {
      players.push(player);
    });

    socket.on('playerLeft', (id) => {
      players = players.filter(p => p.id !== id);
    });

    socket.on('update', (data) => {
      players = data.players;
      tasks = data.tasks;
      exitOpen = data.exitOpen;
    });

    socket.on('taskCompleted', (data) => {
      for (let i = 0; i < 30; i++) {
        const task = tasks[data.taskId];
        particles.push(new Particle(task.x, task.y, '#00ff00'));
      }
    });

    socket.on('playerCaptured', (data) => {
      showNotification('捕獲！', `${data.studentName}が捕まった！`);
    });

    socket.on('playerEscaped', (data) => {
      showNotification('脱出成功！', `${data.name}が脱出した！`);
    });

    socket.on('exitOpen', () => {
      showNotification('脱出可能！', '全タスク完了！出口へ急げ！');
    });

    socket.on('gameEnd', (data) => {
      if (data.winner === 'teacher') {
        showNotification('ゲーム終了', '加藤先生の勝利！');
      }
    });

    socket.on('newTeacher', (teacherId) => {
      console.log('New teacher:', teacherId);
    });

    function showNotification(title, text) {
      const notif = document.getElementById('notification');
      document.getElementById('notifTitle').textContent = title;
      document.getElementById('notifText').textContent = text;
      notif.style.display = 'block';
      
      setTimeout(() => {
        notif.style.display = 'none';
      }, 3000);
    }

    // 描画ループ
    function draw() {
      // 背景
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // グリッド
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 60) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 60) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // 障害物
      obstacles.forEach(obs => {
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#666';
        ctx.fillStyle = '#333';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
        ctx.restore();
      });

      // 出口
      if (exitOpen) {
        const exitX = canvas.width / 2;
        const exitY = 50;
        
        ctx.save();
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#00ff00';
        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🚪 出口', exitX, exitY);
        
        ctx.beginPath();
        ctx.arc(exitX, exitY + 20, 60, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }

      // タスク
      const me = players.find(p => p.id === myId);
      nearbyTask = null;
      
      tasks.forEach(task => {
        const color = task.completed ? '#00ff00' : '#ffaa00';
        
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = color;
        
        // 机
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(task.x - 30, task.y - 20, 60, 40);
        
        // タスクマーク
        ctx.fillStyle = color;
        ctx.font = 'bold 25px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(task.completed ? '✓' : '📝', task.x, task.y + 5);
        
        // プログレスバー
        if (!task.completed && task.progress > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(task.x - 30, task.y - 35, 60, 8);
          
          ctx.fillStyle = '#00ff00';
          ctx.fillRect(task.x - 30, task.y - 35, 60 * (task.progress / 100), 8);
        }
        
        ctx.restore();

        // 近くにいるか判定
        if (me && !me.isTeacher && !me.isCaptured && !task.completed) {
          const dx = task.x - me.x;
          const dy = task.y - me.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < 60) {
            nearbyTask = task.id;
            
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#000';
            ctx.fillText('[E] 宿題提出', task.x, task.y - 45);
            ctx.restore();
          }
        }
      });

      // パーティクル
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw(ctx);
      });

      // プレイヤー
      players.forEach(player => {
        if (player.isCaptured && !player.isTeacher) {
          return; // 捕獲された生徒は表示しない
        }

        const color = player.isTeacher ? '#ff0000' : '#00ffff';
        const size = player.isTeacher ? 30 : 25;
        
        // パーティクル
        if ((player.vx !== 0 || player.vy !== 0) && Math.random() > 0.7) {
          particles.push(new Particle(player.x, player.y, color));
        }

        // 影
        ctx.save();
        ctx.shadowBlur = player.isTeacher ? 50 : 35;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, size + 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // プレイヤー本体
        const gradient = ctx.createRadialGradient(player.x, player.y, 5, player.x, player.y, size);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.4, color);
        gradient.addColorStop(1, player.isTeacher ? '#880000' : '#004444');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(player.x, player.y, size, 0, Math.PI * 2);
        ctx.fill();

        // 名前
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#000';
        ctx.fillText(player.name, player.x, player.y - 40);
        ctx.restore();

        // アイコン
        if (player.isTeacher) {
          ctx.save();
          ctx.font = 'bold 28px Arial';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#ff0000';
          ctx.fillText('👨‍🏫', player.x, player.y + 50);
          ctx.restore();
        }
      });

      // HUD更新
      if (me) {
        document.getElementById('roleText').textContent = me.isTeacher ? '👨‍🏫 加藤先生' : (me.isCaptured ? '👻 観戦中' : '🏃 生徒');
        document.getElementById('roleText').style.color = me.isTeacher ? '#ff0000' : '#00ffff';
        document.getElementById('statsText').textContent = `スコア: ${me.score}点`;
        
        const completedTasks = tasks.filter(t => t.completed).length;
        document.getElementById('taskText').textContent = `${completedTasks}/${tasks.length}`;
      }

      // プレイヤーリスト
      const listContent = document.getElementById('playerListContent');
      listContent.innerHTML = '';
      players
        .sort((a, b) => b.score - a.score)
        .forEach(player => {
          const div = document.createElement('div');
          div.className = 'player-item';
          if (player.isTeacher) div.classList.add('teacher');
          if (player.isCaptured && !player.isTeacher) div.classList.add('captured');
          
          let icon = player.isTeacher ? '👨‍🏫' : '🏃';
          if (player.isCaptured && !player.isTeacher) icon = '👻';
          
          div.textContent = `${icon} ${player.name}: ${player.score}点`;
          listContent.appendChild(div);
        });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
