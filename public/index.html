<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>加藤先生から逃げろ！オンライン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      overflow: hidden;
      color: #fff;
    }

    #loginScreen, #lobbyScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
    }

    #loginScreen.hidden, #lobbyScreen.hidden {
      display: none;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
      50% { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000; }
    }

    input[type="text"] {
      padding: 15px 30px;
      font-size: 1.2em;
      border: 2px solid #ff0000;
      background: rgba(255, 0, 0, 0.1);
      color: #fff;
      border-radius: 10px;
      margin-bottom: 20px;
      outline: none;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    #emojiSelector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      max-width: 400px;
      justify-content: center;
    }

    .emoji-option {
      width: 60px;
      height: 60px;
      font-size: 2.5em;
      border: 3px solid #666;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 0, 0, 0.1);
    }

    .emoji-option:hover {
      transform: scale(1.1);
      border-color: #ffaa00;
    }

    .emoji-option.selected {
      border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      transform: scale(1.15);
    }

    #colorSelector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      max-width: 400px;
      justify-content: center;
    }

    .color-option {
      width: 40px;
      height: 40px;
      border: 3px solid #666;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
    }

    .color-option:hover {
      transform: scale(1.1);
    }

    .color-option.selected {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      transform: scale(1.2);
    }

    button {
      padding: 15px 40px;
      font-size: 1.1em;
      border: none;
      background: linear-gradient(135deg, #ff0000 0%, #aa0000 100%);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      transition: all 0.3s;
      margin: 5px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #lobbyPlayers {
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #ff0000;
      margin: 20px 0;
      min-width: 400px;
      max-height: 400px;
      overflow-y: auto;
    }

    .lobby-player {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lobby-player.teacher {
      background: rgba(255, 0, 0, 0.3);
      border: 2px solid #ff0000;
    }

    .lobby-player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lobby-player-emoji {
      font-size: 2em;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: none;
      overflow: hidden;
      background: #0a0a0a;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #minimap {
      position: fixed;
      bottom: 15px;
      left: 15px;
      width: 240px;
      height: 160px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ff0000;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      z-index: 100;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
      z-index: 100;
    }

    #roleText {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #ff0000;
    }

    #statsText {
      font-size: 1em;
      color: #ffaa00;
    }

    #taskProgress {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #00ff00;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
      z-index: 100;
    }

    #taskProgress h3 {
      color: #00ff00;
      font-size: 1em;
      margin-bottom: 5px;
    }

    #taskProgress p {
      font-size: 1.4em;
      font-weight: bold;
    }

    #playerList {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.9);
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ffaa00;
      max-height: 250px;
      overflow-y: auto;
      min-width: 200px;
      z-index: 100;
    }

    #playerList h3 {
      color: #ffaa00;
      font-size: 1em;
      margin-bottom: 10px;
      text-align: center;
    }

    .player-item {
      padding: 8px 10px;
      margin: 5px 0;
      background: rgba(255, 170, 0, 0.1);
      border-radius: 5px;
      font-size: 0.9em;
    }

    .player-item.teacher {
      background: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff0000;
    }

    .player-item.captured {
      opacity: 0.5;
      text-decoration: line-through;
    }

    #joystickArea {
      position: fixed;
      bottom: 190px;
      left: 30px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      border: 3px solid rgba(255, 0, 0, 0.4);
      display: none;
      z-index: 50;
    }

    #joystick {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #ff0000 0%, #aa0000 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10em;
      font-weight: bold;
      text-shadow: 0 0 50px #ff0000, 0 0 100px #ff0000;
      z-index: 200;
      display: none;
      animation: countdownPulse 0.8s ease-out;
    }

    @keyframes countdownPulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    #notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 30px 50px;
      border-radius: 15px;
      border: 3px solid #ff0000;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
      z-index: 200;
      display: none;
      text-align: center;
    }

    #notification h2 {
      font-size: 2em;
      margin-bottom: 15px;
      text-shadow: 0 0 20px #ff0000;
    }

    #notification p {
      font-size: 1.2em;
      color: #ffaa00;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      #joystickArea {
        display: flex;
      }
      
      #lobbyPlayers {
        min-width: 300px;
      }

      #minimap {
        width: 180px;
        height: 120px;
      }

      #hud {
        padding: 12px 20px;
      }

      #roleText {
        font-size: 1.3em;
      }

      #emojiSelector {
        max-width: 300px;
      }

      .emoji-option {
        width: 50px;
        height: 50px;
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <h1>🏫 加藤先生から逃げろ！</h1>
    <p style="color: #ffaa00; font-size: 1.1em; margin-bottom: 20px;">アイコンを選択</p>
    <div id="emojiSelector"></div>
    <p style="color: #ffaa00; font-size: 0.9em; margin-bottom: 10px;">カラーを選択</p>
    <div id="colorSelector"></div>
    <input type="text" id="nameInput" placeholder="名前を入力" maxlength="12">
    <button id="joinButton">ゲーム参加</button>
  </div>

  <div id="lobbyScreen" class="hidden">
    <h1>🎮 ロビー</h1>
    <div id="lobbyPlayers">
      <h3 style="color: #ffaa00; margin-bottom: 15px;">参加プレイヤー</h3>
      <div id="lobbyPlayerList"></div>
    </div>
    <div id="lobbyControls">
      <button id="startButton" style="display: none;">ゲーム開始</button>
    </div>
    <p style="color: #888; font-size: 0.9em; margin-top: 10px;">ホストが鬼を選択してゲームを開始できます</p>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <canvas id="minimap"></canvas>
    
    <div id="hud">
      <div id="roleText">生徒</div>
      <div id="statsText">スコア: 0点</div>
    </div>

    <div id="taskProgress">
      <h3>📋 タスク進捗</h3>
      <p id="taskText">0/12</p>
    </div>

    <div id="playerList">
      <h3>👥 プレイヤー</h3>
      <div id="playerListContent"></div>
    </div>

    <div id="joystickArea">
      <div id="joystick"></div>
    </div>

    <div id="countdown">3</div>

    <div id="notification">
      <h2 id="notifTitle">通知</h2>
      <p id="notifText"></p>
      <button id="restartButton" style="display: none;">ロビーに戻る</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');
    const socket = io();

    let WORLD_WIDTH = 3600;
    let WORLD_HEIGHT = 2400;
    let viewportWidth = window.innerWidth;
    let viewportHeight = window.innerHeight;

    const ZOOM_FACTOR = 0.65;

    canvas.width = viewportWidth;
    canvas.height = viewportHeight;
    
    const minimapWidth = 240;
    const minimapHeight = 160;
    minimapCanvas.width = minimapWidth;
    minimapCanvas.height = minimapHeight;

    let myId = null;
    let isHost = false;
    let players = [];
    let tasks = [];
    let obstacles = [];
    let exitOpen = false;
    let gameStarted = false;
    let keys = {};
    let joystickActive = false;
    let joystickDir = { x: 0, y: 0 };
    let cameraX = 0;
    let cameraY = 0;

    // 絵文字とカラーの選択
    const emojis = ['😀', '😎', '🤓', '😇', '🤔', '😴', '🥳', '🤩', '😈', '👽', '🤖', '🐱', '🐶', '🐼', '🦊', '🐯'];
    const colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff8800', '#0088ff', '#ff0088', '#88ff00'];
    
    let selectedEmoji = '😀';
    let selectedColor = '#00ffff';

    // 絵文字セレクター生成
    const emojiSelector = document.getElementById('emojiSelector');
    emojis.forEach(emoji => {
      const div = document.createElement('div');
      div.className = 'emoji-option';
      if (emoji === selectedEmoji) div.classList.add('selected');
      div.textContent = emoji;
      div.onclick = () => {
        document.querySelectorAll('.emoji-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectedEmoji = emoji;
      };
      emojiSelector.appendChild(div);
    });

    // カラーセレクター生成
    const colorSelector = document.getElementById('colorSelector');
    colors.forEach(color => {
      const div = document.createElement('div');
      div.className = 'color-option';
      if (color === selectedColor) div.classList.add('selected');
      div.style.background = color;
      div.onclick = () => {
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectedColor = color;
      };
      colorSelector.appendChild(div);
    });

    window.addEventListener('resize', () => {
      viewportWidth = window.innerWidth;
      viewportHeight = window.innerHeight;
      canvas.width = viewportWidth;
      canvas.height = viewportHeight;
    });

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.life = 1;
        this.color = color;
        this.size = Math.random() * 4 + 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.015;
        this.vy += 0.1;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - cameraX, this.y - cameraY, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];

    document.getElementById('joinButton').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim() || 'Player';
      socket.emit('join', { name: name, emoji: selectedEmoji, color: selectedColor });
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
    });

    document.getElementById('nameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('joinButton').click();
      }
    });

    socket.on('lobbyUpdate', (data) => {
      players = data.players;
      isHost = myId === data.hostId;

      const listDiv = document.getElementById('lobbyPlayerList');
      listDiv.innerHTML = '';
      
      data.players.forEach(player => {
        const div = document.createElement('div');
        div.className = 'lobby-player' + (player.isTeacher ? ' teacher' : '');
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'lobby-player-info';
        
        const emojiSpan = document.createElement('span');
        emojiSpan.className = 'lobby-player-emoji';
        emojiSpan.textContent = player.emoji;
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = player.isTeacher ? `${player.name} (鬼)` : player.name;
        nameSpan.style.color = player.color;
        
        infoDiv.appendChild(emojiSpan);
        infoDiv.appendChild(nameSpan);
        div.appendChild(infoDiv);
        
        if (isHost && !player.isTeacher) {
          const btn = document.createElement('button');
          btn.textContent = '鬼にする';
          btn.style.padding = '5px 15px';
          btn.style.fontSize = '0.9em';
          btn.onclick = () => socket.emit('setTeacher', player.id);
          div.appendChild(btn);
        }
        
        listDiv.appendChild(div);
      });

      document.getElementById('startButton').style.display = isHost && data.players.length >= 2 ? 'block' : 'none';
    });

    document.getElementById('startButton').addEventListener('click', () => {
      socket.emit('startGame');
    });

    document.getElementById('restartButton').addEventListener('click', () => {
      socket.emit('restartGame');
    });

    socket.on('gameStart', (data) => {
      console.log('Received gameStart event', data);
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'block';
      players = data.players;
      tasks = data.tasks;
      gameStarted = true;
      console.log('Game started, players:', players.length, 'tasks:', tasks.length);
    });

    socket.on('countdown', (count) => {
      console.log('Countdown:', count);
      const countdownDiv = document.getElementById('countdown');
      if (count > 0) {
        countdownDiv.textContent = count;
        countdownDiv.style.color = '#ff0000';
        countdownDiv.style.display = 'block';
        setTimeout(() => {
          countdownDiv.style.display = 'none';
        }, 800);
      } else {
        countdownDiv.textContent = 'GO!';
        countdownDiv.style.color = '#00ff00';
        countdownDiv.style.display = 'block';
        setTimeout(() => {
          countdownDiv.style.display = 'none';
          countdownDiv.style.color = '#ff0000';
        }, 800);
      }
    });

    socket.on('backToLobby', (data) => {
      gameStarted = false;
      document.getElementById('gameContainer').style.display = 'none';
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('notification').style.display = 'none';
      players = data.players;
      
      const listDiv = document.getElementById('lobbyPlayerList');
      listDiv.innerHTML = '';
      
      data.players.forEach(player => {
        const div = document.createElement('div');
        div.className = 'lobby-player';
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'lobby-player-info';
        
        const emojiSpan = document.createElement('span');
        emojiSpan.className = 'lobby-player-emoji';
        emojiSpan.textContent = player.emoji;
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = player.name;
        nameSpan.style.color = player.color;
        
        infoDiv.appendChild(emojiSpan);
        infoDiv.appendChild(nameSpan);
        div.appendChild(infoDiv);
        
        if (isHost) {
          const btn = document.createElement('button');
          btn.textContent = '鬼にする';
          btn.style.padding = '5px 15px';
          btn.style.fontSize = '0.9em';
          btn.onclick = () => socket.emit('setTeacher', player.id);
          div.appendChild(btn);
        }
        
        listDiv.appendChild(div);
      });
    });

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      updateMovement();
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      updateMovement();
    });

    function updateMovement() {
      let x = 0, y = 0;
      
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) x -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) x += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) y -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) y += 1;

      if (x !== 0 || y !== 0) {
        const length = Math.sqrt(x * x + y * y);
        x /= length;
        y /= length;
      }

      socket.emit('move', { x, y });
    }

    const joystickArea = document.getElementById('joystickArea');
    const joystick = document.getElementById('joystick');

    joystickArea.addEventListener('touchstart', handleJoystickStart);
    joystickArea.addEventListener('touchmove', handleJoystickMove);
    joystickArea.addEventListener('touchend', handleJoystickEnd);

    function handleJoystickStart(e) {
      e.preventDefault();
      joystickActive = true;
    }

    function handleJoystickMove(e) {
      e.preventDefault();
      if (!joystickActive) return;

      const rect = joystickArea.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const touch = e.touches[0];
      const x = touch.clientX - centerX;
      const y = touch.clientY - centerY;

      const distance = Math.sqrt(x * x + y * y);
      const maxDistance = rect.width / 2 - 35;

      if (distance > 0) {
        let dirX = x / distance;
        let dirY = y / distance;
        
        const clampedDistance = Math.min(distance, maxDistance);
        const offsetX = dirX * clampedDistance;
        const offsetY = dirY * clampedDistance;
        
        joystick.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;

        joystickDir.x = dirX;
        joystickDir.y = dirY;
        socket.emit('move', joystickDir);
      }
    }

    function handleJoystickEnd(e) {
      e.preventDefault();
      joystickActive = false;
      joystick.style.transform = 'translate(-50%, -50%)';
      joystickDir = { x: 0, y: 0 };
      socket.emit('move', joystickDir);
    }

    socket.on('init', (data) => {
      myId = data.id;
      players = data.players;
      tasks = data.tasks;
      obstacles = data.obstacles;
      exitOpen = data.exitOpen;
      gameStarted = data.gameStarted;
      isHost = data.isHost;
      WORLD_WIDTH = data.worldWidth;
      WORLD_HEIGHT = data.worldHeight;
    });

    socket.on('playerJoined', (player) => {
      if (!gameStarted) {
        players.push(player);
      }
    });

    socket.on('playerLeft', (id) => {
      players = players.filter(p => p.id !== id);
    });

    socket.on('update', (data) => {
      players = data.players;
      tasks = data.tasks;
      exitOpen = data.exitOpen;
    });

    socket.on('taskCompleted', (data) => {
      for (let i = 0; i < 40; i++) {
        const task = tasks[data.taskId];
        if (task) {
          particles.push(new Particle(task.x, task.y, '#00ff00'));
        }
      }
    });

    socket.on('playerCaptured', (data) => {
      showNotification('捕獲！', `${data.studentName}が捕まった！`, false);
    });

    socket.on('playerEscaped', (data) => {
      showNotification('脱出成功！', `${data.name}が脱出した！`, false);
    });

    socket.on('exitOpen', () => {
      showNotification('脱出可能！', '全タスク完了！画面上部の出口へ急げ！', false);
    });

    socket.on('gameEnd', (data) => {
      if (data.winner === 'teacher') {
        showNotification('ゲーム終了', '鬼の勝利！', true);
      } else {
        showNotification('ゲーム終了', '生徒の勝利！', true);
      }
    });

    socket.on('newTeacher', (teacherId) => {
      console.log('New teacher:', teacherId);
    });

    function showNotification(title, text, showRestart) {
      const notif = document.getElementById('notification');
      document.getElementById('notifTitle').textContent = title;
      document.getElementById('notifText').textContent = text;
      document.getElementById('restartButton').style.display = (showRestart && isHost) ? 'block' : 'none';
      notif.style.display = 'block';
      
      if (!showRestart) {
        setTimeout(() => {
          notif.style.display = 'none';
        }, 3000);
      }
    }

    function drawMinimap() {
      const scaleX = minimapWidth / WORLD_WIDTH;
      const scaleY = minimapHeight / WORLD_HEIGHT;

      minimapCtx.fillStyle = 'rgba(10, 10, 10, 0.9)';
      minimapCtx.fillRect(0, 0, minimapWidth, minimapHeight);

      minimapCtx.fillStyle = 'rgba(50, 50, 50, 0.5)';
      obstacles.forEach(obs => {
        const x = obs.x * scaleX;
        const y = obs.y * scaleY;
        const w = obs.width * scaleX;
        const h = obs.height * scaleY;
        minimapCtx.fillRect(x, y, w, h);
      });

      tasks.forEach(task => {
        const x = task.x * scaleX;
        const y = task.y * scaleY;
        minimapCtx.fillStyle = task.completed ? '#00ff00' : '#ffaa00';
        minimapCtx.shadowBlur = 3;
        minimapCtx.shadowColor = minimapCtx.fillStyle;
        minimapCtx.beginPath();
        minimapCtx.arc(x, y, 3, 0, Math.PI * 2);
        minimapCtx.fill();
        minimapCtx.shadowBlur = 0;
      });

      if (exitOpen) {
        const exitX = (WORLD_WIDTH / 2) * scaleX;
        const exitY = 200 * scaleY;
        minimapCtx.fillStyle = '#00ff00';
        minimapCtx.shadowBlur = 5;
        minimapCtx.shadowColor = '#00ff00';
        minimapCtx.beginPath();
        minimapCtx.arc(exitX, exitY, 4, 0, Math.PI * 2);
        minimapCtx.fill();
        minimapCtx.shadowBlur = 0;
      }

      players.forEach(player => {
        if (player.isCaptured && !player.isTeacher) return;

        const x = player.x * scaleX;
        const y = player.y * scaleY;
        const color = player.isTeacher ? '#ff0000' : player.color;
        const size = player.isTeacher ? 5 : 4;

        minimapCtx.fillStyle = color;
        minimapCtx.shadowBlur = 8;
        minimapCtx.shadowColor = color;
        minimapCtx.beginPath();
        minimapCtx.arc(x, y, size, 0, Math.PI * 2);
        minimapCtx.fill();
        minimapCtx.shadowBlur = 0;
      });

      const me = players.find(p => p.id === myId);
      if (me) {
        const viewWidth = (viewportWidth / ZOOM_FACTOR) * scaleX;
        const viewHeight = (viewportHeight / ZOOM_FACTOR) * scaleY;
        const viewX = cameraX * scaleX;
        const viewY = cameraY * scaleY;

        minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        minimapCtx.lineWidth = 2;
        minimapCtx.strokeRect(viewX, viewY, viewWidth, viewHeight);
      }
    }

    let time = 0;
    function draw() {
      time += 0.02;

      const me = players.find(p => p.id === myId);
      if (me) {
        const effectiveViewWidth = viewportWidth / ZOOM_FACTOR;
        const effectiveViewHeight = viewportHeight / ZOOM_FACTOR;
        
        cameraX = me.x - effectiveViewWidth / 2;
        cameraY = me.y - effectiveViewHeight / 2;
        
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - effectiveViewWidth, cameraX));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - effectiveViewHeight, cameraY));
      }

      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(ZOOM_FACTOR, ZOOM_FACTOR);
      ctx.translate(-cameraX, -cameraY);

      ctx.strokeStyle = 'rgba(255, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      const gridSize = 100;
      const startX = Math.floor(cameraX / gridSize) * gridSize;
      const startY = Math.floor(cameraY / gridSize) * gridSize;
      const endX = cameraX + viewportWidth / ZOOM_FACTOR;
      const endY = cameraY + viewportHeight / ZOOM_FACTOR;
      
      for (let i = startX; i < endX + gridSize; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, cameraY);
        ctx.lineTo(i, endY);
        ctx.stroke();
      }
      for (let i = startY; i < endY + gridSize; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(cameraX, i);
        ctx.lineTo(endX, i);
        ctx.stroke();
      }

      obstacles.forEach(obs => {
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#666';
        ctx.fillStyle = '#333';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
        ctx.restore();
      });

      if (exitOpen) {
        const exitX = WORLD_WIDTH / 2;
        const exitY = 200;
        
        ctx.save();
        const glowSize = 180 + Math.sin(time * 3) * 25;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = '#00ff00';
        ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
        ctx.beginPath();
        ctx.arc(exitX, exitY, 100, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 6;
        ctx.shadowBlur = 45;
        ctx.shadowColor = '#00ff00';
        ctx.beginPath();
        ctx.arc(exitX, exitY, 110 + Math.sin(time * 5) * 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 60px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 50;
        ctx.shadowColor = '#00ff00';
        ctx.fillText('⬆', exitX, exitY - 15);
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 35px Arial';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 35;
        ctx.shadowColor = '#00ff00';
        ctx.fillText('🚪 出口', exitX, exitY + 65);
        ctx.restore();

        if (Math.random() > 0.65) {
          particles.push(new Particle(exitX + (Math.random() - 0.5) * 120, exitY, '#00ff00'));
        }
      }

      tasks.forEach(task => {
        const color = task.completed ? '#00ff00' : '#ffaa00';
        
        ctx.save();
        ctx.shadowBlur = 30;
        ctx.shadowColor = color;
        
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(task.x - 40, task.y - 25, 80, 50);
        
        ctx.fillStyle = color;
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(task.completed ? '✓' : '📝', task.x, task.y + 8);
        
        if (!task.completed && task.progress > 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(task.x - 45, task.y - 50, 90, 12);
          
          ctx.fillStyle = '#00ff00';
          ctx.fillRect(task.x - 45, task.y - 50, 90 * (task.progress / 100), 12);
          
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px Arial';
          ctx.fillText(Math.floor(task.progress) + '%', task.x, task.y - 60);
        }
        
        ctx.restore();

        if (me && !me.isTeacher && !me.isCaptured && !task.completed) {
          const dx = task.x - me.x;
          const dy = task.y - me.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const isMoving = Math.abs(me.vx) > 0.1 || Math.abs(me.vy) > 0.1;
          
          if (distance < 80) {
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#000';
            ctx.fillText(isMoving ? '立ち止まって提出' : '提出中...', task.x, task.y - 70);
            ctx.restore();
          }
        }
      });

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 20;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      players.forEach(player => {
        if (player.isCaptured && !player.isTeacher) return;

        const color = player.isTeacher ? '#ff0000' : player.color;
        const size = player.isTeacher ? 35 : 30;
        
        if ((player.vx !== 0 || player.vy !== 0) && Math.random() > 0.65) {
          particles.push(new Particle(player.x, player.y, color));
        }

        ctx.save();
        ctx.shadowBlur = player.isTeacher ? 55 : 40;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, size + 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // グラデーション円
        const gradient = ctx.createRadialGradient(player.x, player.y, 5, player.x, player.y, size);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.4, color);
        gradient.addColorStop(1, player.isTeacher ? '#880000' : '#004444');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(player.x, player.y, size, 0, Math.PI * 2);
        ctx.fill();

        // 絵文字
        ctx.save();
        ctx.font = 'bold 35px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(player.emoji, player.x, player.y);
        ctx.restore();

        // 名前
        ctx.save();
        ctx.fillStyle = player.color;
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#000';
        ctx.fillText(player.name, player.x, player.y - 50);
        ctx.restore();

        if (player.isTeacher) {
          ctx.save();
          ctx.font = 'bold 35px Arial';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 25;
          ctx.shadowColor = '#ff0000';
          ctx.fillText('👹', player.x, player.y + 60);
          ctx.restore();
        }
      });

      ctx.restore();

      drawMinimap();

      if (me) {
        const roleIcon = me.isTeacher ? '👹' : (me.isCaptured ? '👻' : '🏃');
        const roleText = me.isTeacher ? '鬼' : (me.isCaptured ? '観戦中' : '生徒');
        document.getElementById('roleText').textContent = `${roleIcon} ${roleText}`;
        document.getElementById('roleText').style.color = me.isTeacher ? '#ff0000' : me.color;
        document.getElementById('statsText').textContent = `スコア: ${me.score}点`;
        
        const completedTasks = tasks.filter(t => t.completed).length;
        document.getElementById('taskText').textContent = `${completedTasks}/${tasks.length}`;
      }

      const listContent = document.getElementById('playerListContent');
      listContent.innerHTML = '';
      players
        .sort((a, b) => b.score - a.score)
        .forEach(player => {
          const div = document.createElement('div');
          div.className = 'player-item';
          if (player.isTeacher) div.classList.add('teacher');
          if (player.isCaptured && !player.isTeacher) div.classList.add('captured');
          
          let icon = player.emoji;
          if (player.isCaptured && !player.isTeacher) icon = '👻';
          
          div.textContent = `${icon} ${player.name}: ${player.score}点`;
          listContent.appendChild(div);
        });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
